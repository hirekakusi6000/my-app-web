# 公開サーバー（Linux）用のサイトの設定。
#
# 置き方（Debian / Ubuntu の例）:
#   sudo cp -r deploy/nginx/office-seat /etc/nginx/office-seat
#   sudo cp deploy/nginx/sites/office-seat.conf /etc/nginx/sites-available/office-seat.conf
#   sudo ln -s /etc/nginx/sites-available/office-seat.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 変えるところ: server_name（seat.example.com）、証明書のパス、root（dist/ を置いた場所）

include office-seat/http.conf;

# http:// は https:// に転送する（Let's Encrypt の確認用のパスだけは http のまま返す）
server {
    listen 80;
    listen [::]:80;
    server_name seat.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name seat.example.com;

    # 証明書は Let's Encrypt（certbot）などで用意する
    ssl_certificate     /etc/letsencrypt/live/seat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 画面（my-app-web で npm ci && npm run build して作った dist/）
    root /srv/office-web/dist;

    include office-seat/app.conf;
}
