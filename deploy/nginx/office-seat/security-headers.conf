# 画面に付けるセキュリティヘッダー。値は security-headers.ts と同じにする（変えるときは両方を変える）。
# nginx の add_header は、location に1つでも書くと上の階層の add_header が使われなくなるので、
# 画面を返す location ごとにこのファイルを読み込む。

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security $office_seat_hsts always;
