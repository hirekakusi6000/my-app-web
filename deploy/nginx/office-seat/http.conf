# http { } の中で読み込む設定（API サーバーの場所、HSTS の値）。
# 公開時は /etc/nginx/office-seat/ に置き、サイトの設定（sites/office-seat.conf）から読み込む。

# API サーバー（Uvicorn + FastAPI）。外からは直接つながず、nginx からだけ転送する
upstream office_seat_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HSTS は HTTPS のときだけ付ける（値が空のヘッダーは送られない）
map $scheme $office_seat_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}
