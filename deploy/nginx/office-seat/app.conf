# server { } の中で読み込む設定。画面（dist/）を返し、/api だけを API サーバーに転送する。
# root（dist/ の場所）は、読み込む側の server { } で指定する。

server_tokens off;   # エラー画面などに nginx のバージョンを出さない

# ───────── API ─────────
location /api/ {
    proxy_pass http://office_seat_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # 利用者の本当の IP（Uvicorn の --proxy-headers で受け取り、ログイン回数制限に使う）。
    # 利用者が送ってきた X-Forwarded-For は信用しないので、追記せずに上書きする
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # プロフィール画像（2MB）と CSV（100KB）より少し大きくする
    client_max_body_size 3m;
}

# API 仕様書（APP_ENABLE_API_DOCS=true のときだけ、FastAPI が返す）
location ~ ^/(docs|redoc|openapi\.json)$ {
    proxy_pass http://office_seat_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ───────── 画面 ─────────

# Vue のビルド結果。ファイル名に内容のハッシュが入っているので、長くキャッシュしてよい
location ^~ /assets/vue/ {
    include office-seat/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# それ以外の画面（HTML・移行前の CSS / JS）。更新がすぐ反映されるよう、毎回サーバーに確認させる
location / {
    include office-seat/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    index index.html;
    try_files $uri $uri/ =404;
}
