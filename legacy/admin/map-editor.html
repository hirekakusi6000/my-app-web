<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マップ編集 | オフィス座席・従業員管理</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/map.css">
</head>
<body>
  <header id="app-header"></header>
  <main class="editor">
    <aside class="editor__palette">
      <h2 class="editor__heading">部品</h2>
      <p class="field__hint">クリックで部屋に追加します。</p>
      <div class="editor__palette-items" id="palette"></div>
      <h2 class="editor__heading">操作</h2>
      <ul class="editor__help">
        <li>ドラッグで移動（選択中の家具はまとめて動く）</li>
        <li>何もない所をドラッグで範囲選択</li>
        <li><kbd>Shift</kbd>+クリックで選択に追加・解除</li>
        <li>右下の □ をドラッグで大きさ変更</li>
        <li>矢印キーで1マス移動</li>
        <li><kbd>R</kbd> で回転、<kbd>Delete</kbd> で削除</li>
        <li><kbd>Ctrl</kbd>+<kbd>C</kbd> / <kbd>V</kbd> でコピー・貼り付け、<kbd>Ctrl</kbd>+<kbd>D</kbd> で複製</li>
        <li><kbd>Ctrl</kbd>+<kbd>Z</kbd> で元に戻す、<kbd>Ctrl</kbd>+<kbd>Y</kbd> でやり直し</li>
        <li><kbd>Ctrl</kbd>+<kbd>A</kbd> ですべて選択、<kbd>Esc</kbd> で選択解除</li>
      </ul>
    </aside>

    <section class="editor__canvas">
      <div class="editor__toolbar">
        <select class="field__input" id="room-select" aria-label="編集する部屋"></select>
        <span class="editor__status" id="status"></span>
        <button type="button" class="button button--ghost button--small" id="undo" title="元に戻す（Ctrl+Z）" disabled>↶ 元に戻す</button>
        <button type="button" class="button button--ghost button--small" id="redo" title="やり直し（Ctrl+Y）" disabled>↷ やり直し</button>
        <span class="editor__spacer"></span>
        <button type="button" class="button button--ghost" id="revert">保存時の状態に戻す</button>
        <button type="button" class="button" id="save">保存する</button>
      </div>
      <div class="editor__stage" id="stage"></div>
    </section>

    <aside class="editor__props" id="props">
      <h2 class="editor__heading">選択中の家具</h2>
      <p class="field__hint" data-empty>家具をクリックすると、ここで細かく調整できます。</p>
      <div class="form" data-selection hidden>
      <div class="editor__type" data-type></div>
      <form class="form" data-form novalidate>
        <label class="field">
          <span class="field__label">ラベル</span>
          <input class="field__input" type="text" name="label" maxlength="50" placeholder="例：A-1">
        </label>
        <div class="field-row">
          <label class="field"><span class="field__label">X</span><input class="field__input" type="number" name="x" min="0"></label>
          <label class="field"><span class="field__label">Y</span><input class="field__input" type="number" name="y" min="0"></label>
        </div>
        <div class="field-row">
          <label class="field"><span class="field__label">幅</span><input class="field__input" type="number" name="width" min="1"></label>
          <label class="field"><span class="field__label">奥行き</span><input class="field__input" type="number" name="height" min="1"></label>
        </div>
      </form>
      <div class="field">
        <span class="field__label">向き</span>
        <div class="input-row">
          <button type="button" class="button button--ghost" data-rotate="-90" title="左に回転（Shift+R）">⟲ 左</button>
          <button type="button" class="button button--ghost" data-rotate="90" title="右に回転（R）">右 ⟳</button>
        </div>
      </div>
      <div class="input-row">
        <button type="button" class="button button--ghost" data-duplicate title="複製（Ctrl+D）">複製</button>
        <button type="button" class="button button--ghost button--danger-text" data-delete title="削除（Delete）">削除</button>
      </div>
      </div>
    </aside>
  </main>

  <script type="module" src="/js/pages/admin-map-editor.js"></script>
</body>
</html>
