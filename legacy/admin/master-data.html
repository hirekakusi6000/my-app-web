<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>候補の管理 | オフィス座席・従業員管理</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header id="app-header"></header>
  <main class="page page--narrow">
    <div class="page__head">
      <div>
        <h1 class="page__title">候補の管理</h1>
        <p class="page__lead">プロフィール登録で選べる役職・職種・スキルの候補です。従業員が新しい名前を入力した場合も、ここに自動で追加されます。</p>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" class="tabs__tab" role="tab" data-tab="positions" aria-selected="true">役職</button>
      <button type="button" class="tabs__tab" role="tab" data-tab="jobTypes" aria-selected="false">職種</button>
      <button type="button" class="tabs__tab" role="tab" data-tab="skills" aria-selected="false">スキル</button>
    </div>

    <section class="panel">
      <form id="add-form" class="inline-form" novalidate>
        <select class="field__input" name="category" data-only="skills" hidden></select>
        <input class="field__input" type="text" name="name" maxlength="50" placeholder="追加する名前" required>
        <label class="checkbox" data-only="jobTypes" hidden>
          <input type="checkbox" name="is_engineer"> エンジニア
        </label>
        <button type="submit" class="button">追加</button>
      </form>
      <div class="alert alert--error" id="add-error" hidden></div>

      <div class="filter" data-only="skills" hidden>
        <span>表示：</span>
        <select class="field__input" id="skill-filter"></select>
      </div>

      <ul class="item-list" id="item-list"></ul>
    </section>
  </main>

  <dialog class="dialog" id="rename-dialog">
    <form class="form" id="rename-form" novalidate>
      <h2 class="dialog__title">名前の変更</h2>
      <div class="alert alert--error" data-form-error hidden></div>
      <label class="field">
        <span class="field__label">名前</span>
        <input class="field__input" type="text" name="name" maxlength="50" required>
        <span class="field__error" data-error-for="name"></span>
      </label>
      <div class="dialog__actions">
        <button type="button" class="button button--ghost" data-close>キャンセル</button>
        <button type="submit" class="button">変更する</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/pages/admin-master-data.js"></script>
</body>
</html>
