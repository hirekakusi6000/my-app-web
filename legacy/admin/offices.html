<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フロア・部屋 | オフィス座席・従業員管理</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header id="app-header"></header>
  <main class="page page--narrow">
    <div class="page__head">
      <div>
        <h1 class="page__title">フロア・部屋</h1>
        <p class="page__lead">フロアは5つまで、部屋は1つのフロアに5つまで作成できます。<span id="floor-count"></span></p>
      </div>
      <button type="button" class="button" id="add-floor">＋ フロアを追加</button>
    </div>

    <div id="floors"></div>
  </main>

  <!-- フロア名 -->
  <dialog class="dialog" id="floor-dialog">
    <form class="form" id="floor-form" novalidate>
      <h2 class="dialog__title" data-title>フロアを追加</h2>
      <div class="alert alert--error" data-form-error hidden></div>
      <label class="field">
        <span class="field__label">フロア名</span>
        <input class="field__input" type="text" name="name" maxlength="50" placeholder="例：1F" required>
        <span class="field__error" data-error-for="name"></span>
      </label>
      <div class="dialog__actions">
        <button type="button" class="button button--ghost" data-close>キャンセル</button>
        <button type="submit" class="button">保存する</button>
      </div>
    </form>
  </dialog>

  <!-- 部屋 -->
  <dialog class="dialog" id="room-dialog">
    <form class="form" id="room-form" novalidate>
      <h2 class="dialog__title" data-title>部屋を追加</h2>
      <div class="alert alert--error" data-form-error hidden></div>
      <label class="field">
        <span class="field__label">部屋名</span>
        <input class="field__input" type="text" name="name" maxlength="50" placeholder="例：執務室A" required>
        <span class="field__error" data-error-for="name"></span>
      </label>
      <div class="field-row">
        <label class="field">
          <span class="field__label">横幅（マス）</span>
          <input class="field__input" type="number" name="width" min="5" max="200" value="30" required>
          <span class="field__error" data-error-for="width"></span>
        </label>
        <label class="field">
          <span class="field__label">奥行き（マス）</span>
          <input class="field__input" type="number" name="height" min="5" max="200" value="20" required>
          <span class="field__error" data-error-for="height"></span>
        </label>
      </div>
      <span class="field__hint">1マスは椅子1脚分の大きさです。5〜200マスで指定できます。</span>
      <div class="dialog__actions">
        <button type="button" class="button button--ghost" data-close>キャンセル</button>
        <button type="submit" class="button">保存する</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/pages/admin-offices.js"></script>
</body>
</html>
