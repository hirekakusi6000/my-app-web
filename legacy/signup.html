<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規登録 | オフィス座席・従業員管理</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <main class="auth-page">
    <section class="card">
      <h1 class="card__title">新規登録</h1>
      <p class="card__lead">組織を作成し、あなたが管理者（マスター）になります。従業員のアカウントは登録後に作成できます。</p>

      <form id="signup-form" class="form" novalidate>
        <div class="alert alert--error" data-form-error hidden></div>

        <label class="field">
          <span class="field__label">組織名</span>
          <input class="field__input" type="text" name="organization_name" maxlength="100" placeholder="例：株式会社サンプル" required>
          <span class="field__error" data-error-for="organization_name"></span>
        </label>

        <label class="field">
          <span class="field__label">メールアドレス</span>
          <input class="field__input" type="email" name="email" autocomplete="username" required>
          <span class="field__error" data-error-for="email"></span>
        </label>

        <label class="field">
          <span class="field__label">パスワード</span>
          <input class="field__input" type="password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          <span class="field__hint">8文字以上</span>
          <span class="field__error" data-error-for="password"></span>
        </label>

        <label class="field">
          <span class="field__label">パスワード（確認）</span>
          <input class="field__input" type="password" name="password_confirm" autocomplete="new-password" required>
          <span class="field__error" data-error-for="password_confirm"></span>
        </label>

        <button type="submit" class="button button--block">登録する</button>
      </form>

      <p class="card__footer">
        アカウントをお持ちの方は <a href="/login.html">ログイン</a>
      </p>
    </section>
  </main>
  <script type="module" src="/js/pages/signup.js"></script>
</body>
</html>
