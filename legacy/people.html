<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メンバー | オフィス座席・従業員管理</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <header id="app-header"></header>
  <main class="page">
    <div class="page__head">
      <div>
        <h1 class="page__title">メンバー</h1>
        <p class="page__lead">名前・技術スキル・在席状態で、同じ組織のメンバーを探せます。</p>
      </div>
    </div>

    <section class="panel search-panel">
      <form id="search-form" class="search-form" novalidate>
        <label class="field">
          <span class="field__label">名前</span>
          <input class="field__input" type="search" name="name" maxlength="50" placeholder="名前の一部">
        </label>

        <div class="field">
          <span class="field__label">スキル（すべてを持つ人）</span>
          <div class="input-row">
            <input class="field__input" type="text" id="skill-input" maxlength="50" list="skill-options" placeholder="例：Python">
            <datalist id="skill-options"></datalist>
            <button type="button" class="button button--ghost" id="add-skill">追加</button>
          </div>
          <div class="chips" id="skill-chips"></div>
        </div>

        <label class="field">
          <span class="field__label">経験年数</span>
          <select class="field__input" name="min_years">
            <option value="0">指定なし</option>
            <option value="1">1年以上</option>
            <option value="3">3年以上</option>
            <option value="5">5年以上</option>
            <option value="10">10年以上</option>
          </select>
        </label>

        <fieldset class="field status-filter">
          <legend class="field__label">在席状態</legend>
          <label class="checkbox"><input type="checkbox" name="status" value="present"> 在席中</label>
          <label class="checkbox"><input type="checkbox" name="status" value="away"> 離席中</label>
          <label class="checkbox"><input type="checkbox" name="status" value="remote"> リモート</label>
          <label class="checkbox"><input type="checkbox" name="status" value="not_working"> 未出勤</label>
        </fieldset>
      </form>
    </section>

    <p class="result-count" id="result-count"></p>
    <div class="people-grid" id="results"></div>
  </main>
  <script type="module" src="/js/pages/people.js"></script>
</body>
</html>
