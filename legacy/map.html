<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マップ | オフィス座席・従業員管理</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/map.css">
</head>
<body>
  <header id="app-header"></header>
  <main class="map-page">
    <nav class="map-page__rooms" aria-label="フロアと部屋">
      <ul class="room-nav" id="room-nav"></ul>
    </nav>

    <section class="map-page__main">
      <div class="map-page__title">
        <h1 id="room-title">マップ</h1>
        <span class="map-page__updated" id="updated"></span>
      </div>
      <!-- 座席を選んでいる間だけ表示する -->
      <div class="pick-bar" id="pick-bar" hidden>
        <span class="pick-bar__text" id="pick-text">空いている椅子をクリックして選んでください</span>
        <button type="button" class="button button--ghost" id="pick-cancel">キャンセル</button>
        <button type="button" class="button" id="pick-ok" disabled>この座席で出社</button>
      </div>
      <div class="map-page__stage" id="stage"></div>
    </section>

    <aside class="map-page__side">
      <!-- 一般ユーザーだけに表示 -->
      <section class="side-section" id="my-status" hidden>
        <h2 class="editor__heading">自分の状態</h2>
        <div class="my-status__current">
          <span class="status-badge" id="my-badge"></span>
          <span class="my-status__seat" id="my-seat"></span>
        </div>
        <p class="stale-notice" id="my-stale" hidden>前日の状態のままです。今日の状態に更新してください。</p>
        <div class="my-status__actions" id="my-actions"></div>
        <form class="my-status__comment" id="comment-form" novalidate>
          <label class="field">
            <span class="field__label">ひとことコメント</span>
            <div class="input-row">
              <input class="field__input" type="text" name="comment" maxlength="100" placeholder="例：14時まで会議です">
              <button type="submit" class="button button--ghost">保存</button>
            </div>
          </label>
        </form>
      </section>

      <section class="side-section">
        <h2 class="editor__heading">リモート <span class="count" id="remote-count"></span></h2>
        <ul class="people-list" id="remote-list"></ul>
      </section>

      <section class="side-section">
        <h2 class="editor__heading">表示の見方</h2>
        <ul class="legend">
          <li><span class="legend__dot legend__dot--present"></span>在席中</li>
          <li><span class="legend__dot legend__dot--away"></span>離席中</li>
          <li><span class="legend__dot legend__dot--remote"></span>リモート（上の一覧）</li>
          <li><span class="legend__dot legend__dot--stale"></span>薄い点線：前日から更新なし</li>
        </ul>
        <p class="field__hint">アイコンをクリックするとプロフィールを表示します。表示は30秒ごとに自動で更新されます。</p>
      </section>
    </aside>
  </main>
  <script type="module" src="/js/pages/map.js"></script>
</body>
</html>
