# ライブラリと GitHub Actions の更新を、develop ブランチ向けのプルリクエストで知らせる。
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      # Vue と Vite まわりはまとめて1つのプルリクエストにする
      vue-vite:
        patterns: ["vue", "vue-tsc", "vite", "@vitejs/*"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
